name: ccshelf
description: Install a verified ccshelf release and run one ccshelf command (lint, compile --check, catalog build).
author: ccshelf contributors
branding:
  icon: check-circle
  color: blue

inputs:
  version:
    description: Release tag of ccshelf to install, a strict semver tag such as v0.1.0.
    required: true
  args:
    description: The ccshelf subcommand and flags to run, split on spaces (no quoting). Examples are "lint" and "catalog build --out dist/catalog". Leave empty to install only.
    required: false
    default: ""
  working-directory:
    description: Directory, relative to the workspace, in which the command runs.
    required: false
    default: "."
  sha256:
    description: SHA-256 of the release archive for this runner's OS and architecture, pinned by you. The strongest option, and fully offline. When it is set, the action does not need the signature. When it is not set, the action uses a matching line in its own pins.txt before cosign.
    required: false
    default: ""
  base-url:
    description: Directory that holds <version>/ release assets (the directory name keeps the leading v). Change it for a GHE Server or offline mirror. https:// or file:/// (absolute path) only.
    required: false
    default: https://github.com/yorch/ccshelf/releases/download
  verify-signature:
    description: Verify the cosign signature of checksums.txt when neither sha256 nor a pins.txt line applies. This needs cosign on PATH and the Sigstore trusted root, so it is not offline. "false" is an explicit opt-out, and the action warns loudly about it.
    required: false
    default: "true"
  cosign-identity:
    description: Exact certificate identity the signature must have. Empty means the tool repo's release workflow at the tag, https://github.com/yorch/ccshelf/.github/workflows/release.yml@refs/tags/<version>.
    required: false
    default: ""
  cosign-identity-regexp:
    description: Regular expression the certificate identity must match instead of an exact identity (explicit opt-in, escape dots). Exclusive with cosign-identity.
    required: false
    default: ""
  trusted-root:
    description: Path to a Sigstore trusted root file that your organization mirrors, passed to cosign as --trusted-root. Empty means cosign fetches the root itself.
    required: false
    default: ""
  cosign-oidc-issuer:
    description: OIDC issuer the signing certificate must name.
    required: false
    default: https://token.actions.githubusercontent.com

outputs:
  path:
    description: Absolute path of the installed ccshelf binary.
    value: ${{ steps.install.outputs.path }}
  version:
    description: The installed release tag.
    value: ${{ steps.install.outputs.version }}

runs:
  using: composite
  steps:
    - name: Install ccshelf
      id: install
      shell: bash
      env:
        INPUT_VERSION: ${{ inputs.version }}
        INPUT_SHA256: ${{ inputs.sha256 }}
        INPUT_BASE_URL: ${{ inputs.base-url }}
        INPUT_VERIFY_SIGNATURE: ${{ inputs.verify-signature }}
        INPUT_COSIGN_IDENTITY: ${{ inputs.cosign-identity }}
        INPUT_COSIGN_IDENTITY_REGEXP: ${{ inputs.cosign-identity-regexp }}
        INPUT_TRUSTED_ROOT: ${{ inputs.trusted-root }}
        INPUT_COSIGN_OIDC_ISSUER: ${{ inputs.cosign-oidc-issuer }}
        INPUT_WORKING_DIRECTORY: ${{ inputs.working-directory }}
        ACTION_PATH: ${{ github.action_path }}
      run: bash "$ACTION_PATH/scripts/install.sh"

    - name: Run ccshelf
      shell: bash
      env:
        INPUT_ARGS: ${{ inputs.args }}
        INPUT_WORKING_DIRECTORY: ${{ inputs.working-directory }}
        CCSHELF_BIN: ${{ steps.install.outputs.path }}
      run: |
        set -euo pipefail
        if [ -z "$INPUT_ARGS" ]; then
          echo "No args given: ccshelf installed at $CCSHELF_BIN"
          exit 0
        fi
        case "$INPUT_ARGS" in
          *$'\n'*) echo "error: 'args' must be a single line" >&2; exit 1 ;;
        esac
        # Split on whitespace without eval or globbing.
        read -r -a ccshelf_args <<<"$INPUT_ARGS"
        cd -- "$INPUT_WORKING_DIRECTORY"
        "$CCSHELF_BIN" "${ccshelf_args[@]}"
