# Dependabot keeps Go modules and the SHA-pinned GitHub Actions current (SR5).
# For github-actions it rewrites the full commit SHA and the trailing
# "# vX.Y.Z" comment together.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      go-dependencies:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directories:
      - /
      - /action
      - /examples/org-data-repo
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # The starter template pins this Action to a placeholder SHA by design;
      # adopters replace it with a real release.
      - dependency-name: "yorch/ccshelf/*"
    groups:
      github-actions:
        patterns: ["*"]
