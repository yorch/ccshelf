# Publishes the project website (site/ plus the docs pages rendered from the Markdown by
# scripts/build_docs.py) to GitHub Pages. The site is static and makes no external requests;
# scripts/build-site.sh builds it and runs scripts/check_site.py on the result, here and in ci.yml.
#
# AUTOMATIC AND MANUAL. A push to main that changes the site, the docs, or the build scripts
# publishes it (decision D-45, which supersedes D-34); `workflow_dispatch` republishes on demand
# (for example to pass a different repo_url). Pages must be enabled with source "GitHub Actions"
# (Settings > Pages). Pull requests never deploy: the site is built and validated for them by the
# `site` job in ci.yml. The deploy runs in the protected `github-pages` environment.
name: pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'docs/**'
      - 'scripts/build-site.sh'
      - 'scripts/build_docs.py'
      - 'scripts/gen_cli_reference.py'
      - 'scripts/check_site.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
    inputs:
      repo_url:
        description: 'Public repository URL to link from the site (empty: keep the one committed in site/index.html)'
        required: false
        default: ''
        type: string

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Render the docs, fill in the site address, build the artifact and validate it
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
          REPO_URL: ${{ inputs.repo_url }}
        run: |
          if [ -n "$REPO_URL" ]; then
            bash scripts/build-site.sh _site "$SITE_URL" --repo-url "$REPO_URL"
          else
            bash scripts/build-site.sh _site "$SITE_URL"
          fi
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
