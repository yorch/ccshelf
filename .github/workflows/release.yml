# Release pipeline (SR5). See docs/design/release.md.
#
# Trigger: workflow_dispatch only. There is no tag-push trigger: tags are created by
# release-please (release-please.yml) with GITHUB_TOKEN, and such a tag does not
# trigger workflows. release-please.yml therefore dispatches this workflow with the
# new tag as its ref (`gh workflow run release.yml --ref vX.Y.Z -f dry-run=false`), so
# github.ref is refs/tags/vX.Y.Z and the keyless signing identity is still exactly
# .../release.yml@refs/tags/vX.Y.Z. The same command re-runs a release by hand. A
# manual run defaults to a dry run (goreleaser --snapshot, no signing, no publishing).
#
# Jobs: `verify` (tag, release PR and CI checks), then either `snapshot` (dry runs
# only: no environment, no signing, no publishing, read-only token) or `release`
# (real runs only) and, after a successful release, `pins` (opens the pull request
# that adds the new archive checksums to action/pins.txt).
#
# The `release` job uses the protected `release` environment. Configure that
# environment (Settings > Environments) with required reviewers (two
# maintainers), "prevent self-review", and a deployment tag rule that only
# allows tags matching v*. Secrets for the optional publishers
# (HOMEBREW_TAP_TOKEN, SCOOP_BUCKET_TOKEN, WINGET_TOKEN) belong to that
# environment, never to the repository, so forks and branch builds never see
# them. The tool repo also needs the rulesets listed in CONTRIBUTING.md,
# "Required repository rulesets": the signing identity below is only as
# trustworthy as what a v* tag can point at and who approves the `release`
# environment. See CONTRIBUTING.md, "Releasing".
#
# This repository is public on github.com by definition, so the gh calls below
# target the github.com instance of the workflow run.
name: release

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Dry run: build a snapshot, sign nothing, publish nothing. Set to false only with a version tag selected as the ref."
        type: boolean
        default: true

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GORELEASER_VERSION: v2.18.2
  COSIGN_VERSION: v3.1.3
  SYFT_VERSION: 1.54.0
  # SHA-256 of syft_${SYFT_VERSION}_linux_amd64.tar.gz, from the release's checksums file.
  SYFT_SHA256: 54a87372498168b2d033e876fd41fa4e8035b872699e525a57046e1f2f09c860

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 50 # includes waiting for ci.yml on the tagged commit (up to 40 minutes)
    permissions:
      contents: read
      actions: read # read the ci.yml run status for the tagged commit
    outputs:
      dry-run: ${{ steps.mode.outputs.dry-run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # needed to compare the tag with main
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false # a poisoned build cache must never reach a release
      - name: Decide the mode
        id: mode
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_DRY_RUN: ${{ inputs.dry-run }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          dry=false
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$INPUT_DRY_RUN" = "true" ]; then
            dry=true
          fi
          if [ "$dry" = "false" ] && [ "$REF_TYPE" != "tag" ]; then
            echo "A real release must run from a version tag, not from a branch: gh workflow run release.yml --ref vX.Y.Z -f dry-run=false" >&2
            exit 1
          fi
          echo "dry-run=$dry" >> "$GITHUB_OUTPUT"
      - name: Tag is a release-please version on a commit reachable from main
        if: steps.mode.outputs.dry-run == 'false'
        env:
          TAG: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$TAG" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$'; then
            echo "Tag is not a semantic version: $TAG" >&2
            exit 1
          fi
          # Full history of main (the checkout already has fetch-depth 0): the ancestry
          # check below is only sound on a complete, non-shallow clone.
          git fetch --no-tags --prune origin '+refs/heads/main:refs/remotes/origin/main'
          if [ "$(git rev-parse --is-shallow-repository)" != "false" ]; then
            git fetch --no-tags --unshallow origin
          fi
          if ! git merge-base --is-ancestor "$SHA" refs/remotes/origin/main; then
            echo "Tag $TAG ($SHA) is not an ancestor of main (git merge-base --is-ancestor)." >&2
            exit 1
          fi
          # Second opinion through the API (kept on purpose): compare main with the tag's commit.
          status="$(gh api -X GET "repos/${REPO}/compare/${SHA}...main" --jq '.status')"
          case "$status" in
            identical | ahead) ;;
            *)
              echo "The GitHub compare API says main is '$status' relative to $SHA; the tag is not on main." >&2
              exit 1
              ;;
          esac
          # The tag must name the version that the release pull request wrote into the
          # manifest at that commit. A tag on any other commit, or a tag that was not
          # produced by merging a release pull request, fails here.
          manifest="$(jq -er '.["."]' .release-please-manifest.json)"
          if [ "v${manifest}" != "$TAG" ]; then
            echo "Tag $TAG does not match .release-please-manifest.json ('${manifest}') at $SHA; releases come from the release pull request only." >&2
            exit 1
          fi
          # The draft release that release-please created for this tag must exist, be a
          # draft, and carry the exact name goreleaser looks for (use_existing_draft).
          releases="$(gh api -X GET "repos/${REPO}/releases" --paginate -f per_page=100 \
            | jq -cs --arg t "$TAG" '[.[][] | select(.tag_name == $t)]')"
          if [ "$(jq 'length' <<<"$releases")" != "1" ]; then
            echo "Expected exactly one release for $TAG (the draft that release-please creates); found $(jq 'length' <<<"$releases")." >&2
            exit 1
          fi
          if [ "$(jq -r '.[0].draft' <<<"$releases")" != "true" ]; then
            echo "The release for $TAG is already published; nothing to build. See docs/design/release.md, 'Failure and rollback'." >&2
            exit 1
          fi
          if [ "$(jq -r '.[0].name' <<<"$releases")" != "$TAG" ]; then
            echo "The draft release for $TAG is not named $TAG; goreleaser would create a second release." >&2
            exit 1
          fi
          echo "Tag $TAG verified: ancestor of main, matches the manifest, draft release present."
      # The push to main that merged the release pull request starts ci.yml on the same
      # commit, usually still running when this workflow is dispatched: wait for it.
      - name: ci.yml succeeded for the tagged commit
        if: steps.mode.outputs.dry-run == 'false'
        env:
          SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 2400))
          while :; do
            runs="$(gh api -X GET "repos/${REPO}/actions/workflows/ci.yml/runs" \
              -f head_sha="$SHA" -f per_page=50 --jq '[.workflow_runs[] | {status, conclusion}]')"
            ok="$(jq '[.[] | select(.status == "completed" and .conclusion == "success")] | length' <<<"$runs")"
            open="$(jq '[.[] | select(.status != "completed")] | length' <<<"$runs")"
            if [ "$ok" -ge 1 ]; then
              echo "ci.yml succeeded for $SHA."
              exit 0
            fi
            if [ "$open" -eq 0 ] && [ "$(jq 'length' <<<"$runs")" -gt 0 ]; then
              echo "ci.yml has runs for $SHA but none succeeded." >&2
              exit 1
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "Timed out waiting for ci.yml on $SHA." >&2
              exit 1
            fi
            echo "Waiting for ci.yml on $SHA (runs: $(jq 'length' <<<"$runs"), unfinished: $open)."
            sleep 30
          done
      - name: go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Generated docs report is up to date
        run: python3 docs/build_report.py --check
      - name: Actions are pinned by full commit SHA
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/check-pins.sh

  # Dry runs: build a snapshot with the read-only token. No environment (so no approval
  # and no secrets), no signing (it would write to the public transparency log), no publishing.
  snapshot:
    name: snapshot (dry run)
    needs: verify
    if: needs.verify.outputs.dry-run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # goreleaser builds the changelog from history
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Install syft (pinned release, checksum verified) for SBOMs
        run: |
          set -euo pipefail
          archive="syft_${SYFT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "${RUNNER_TEMP}/${archive}" \
            "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/${archive}"
          echo "${SYFT_SHA256}  ${RUNNER_TEMP}/${archive}" | sha256sum -c -
          mkdir -p "${RUNNER_TEMP}/bin"
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}/bin" syft
          echo "${RUNNER_TEMP}/bin" >> "$GITHUB_PATH"
      - name: goreleaser (snapshot, no signing, no publishing)
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: ${{ env.GORELEASER_VERSION }}
          args: release --snapshot --clean --skip=sign
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-dist-snapshot
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
            dist/*.sbom.json
          if-no-files-found: warn
          retention-days: 7

  release:
    name: release
    needs: verify
    if: needs.verify.outputs.dry-run == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Requires approval from two maintainers (configured on the environment).
    environment: release
    permissions:
      contents: write # create the GitHub release and upload assets
      id-token: write # keyless cosign signing and build provenance
      attestations: write # store the build provenance attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # goreleaser builds the changelog from history
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false # a poisoned build cache must never reach a release
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}
      - name: Install syft (pinned release, checksum verified) for SBOMs
        run: |
          set -euo pipefail
          archive="syft_${SYFT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "${RUNNER_TEMP}/${archive}" \
            "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/${archive}"
          echo "${SYFT_SHA256}  ${RUNNER_TEMP}/${archive}" | sha256sum -c -
          mkdir -p "${RUNNER_TEMP}/bin"
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}/bin" syft
          echo "${RUNNER_TEMP}/bin" >> "$GITHUB_PATH"
      - name: Optional publishers
        env:
          HAS_HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN != '' }}
          HAS_SCOOP_BUCKET_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN != '' }}
          HAS_WINGET_TOKEN: ${{ secrets.WINGET_TOKEN != '' }}
        run: |
          set -euo pipefail
          report() { # name has
            if [ "$2" = "true" ]; then
              echo "$1: token present, publishing enabled (skipped for pre-releases and dry runs)."
            else
              echo "::notice title=$1 skipped::No token configured on the release environment; not publishing."
            fi
          }
          report "Homebrew tap" "$HAS_HOMEBREW_TAP_TOKEN"
          report "Scoop bucket" "$HAS_SCOOP_BUCKET_TOKEN"
          report "WinGet" "$HAS_WINGET_TOKEN"
      # goreleaser appends the verification footer to the draft's notes (release.mode:
      # append). Cut the notes back to what release-please wrote, so that re-running
      # this job after a failure does not append the footer a second time.
      - name: Reset the draft release notes (idempotent re-runs)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          marker='<!-- ccshelf-release-footer -->'
          releases="$(gh api -X GET "repos/${REPO}/releases" --paginate -f per_page=100 \
            | jq -cs --arg t "$TAG" '[.[][] | select(.tag_name == $t and .draft == true)]')"
          if [ "$(jq 'length' <<<"$releases")" != "1" ]; then
            echo "Expected exactly one draft release for $TAG." >&2
            exit 1
          fi
          id="$(jq -r '.[0].id' <<<"$releases")"
          body="$(jq -r '.[0].body // ""' <<<"$releases")"
          case "$body" in
            *"$marker"*)
              body="${body%%"$marker"*}"
              gh api --method PATCH "repos/${REPO}/releases/${id}" -f "body=${body}" >/dev/null
              echo "Removed a footer left by an earlier attempt."
              ;;
            *) echo "Notes are as release-please wrote them." ;;
          esac
      - name: goreleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: ${{ env.GORELEASER_VERSION }}
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          SCOOP_BUCKET_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
      - name: Build provenance attestation (SLSA) for the archives
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt
      - name: Verify the signature we just produced
        env:
          REPO: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          set -euo pipefail
          cosign verify-blob \
            --bundle dist/checksums.txt.sigstore.json \
            --certificate-identity "${SERVER_URL}/${WORKFLOW_REF}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            dist/checksums.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-dist
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
            dist/checksums.txt.sigstore.json
            dist/*.sbom.json
          if-no-files-found: warn
          retention-days: 90

  # After a successful release: open a pull request that appends the six archive
  # checksums of this version to action/pins.txt, so that pinning the Action by commit
  # SHA pins the binary too. Minimal permissions; it only edits that one file through
  # the API on a new branch and never touches main directly.
  #
  # Pull requests created with the default GITHUB_TOKEN do not trigger other workflows,
  # so this job starts ci.yml on the branch itself with workflow_dispatch (the one
  # exception to that rule) and the required check `ci-ok` reports on the pull request.
  # If a repository secret PINS_PR_TOKEN exists (a GitHub App installation token or a
  # fine-grained PAT with contents and pull requests write access on this repository
  # only), it is used instead and the pull request triggers CI by itself. Review the
  # pull request against the signed checksums.txt before merging.
  pins:
    name: pins pull request
    needs: [verify, release]
    if: needs.verify.outputs.dry-run == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the branch and commit action/pins.txt
      pull-requests: write # open the pull request
      actions: write # run ci.yml on the branch when no PINS_PR_TOKEN is configured
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-dist
          path: dist
      - name: Open the pull request that pins the checksums
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.PINS_PR_TOKEN || github.token }}
          HAS_PINS_PR_TOKEN: ${{ secrets.PINS_PR_TOKEN != '' }}
          ACTIONS_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "Tag is not a plain semantic version: $TAG" >&2
            exit 1
          fi
          bare="${TAG#v}"
          lines=""
          for target in linux:amd64:tar.gz linux:arm64:tar.gz darwin:amd64:tar.gz darwin:arm64:tar.gz windows:amd64:zip windows:arm64:zip; do
            IFS=: read -r os arch ext <<<"$target"
            name="ccshelf_${bare}_${os}_${arch}.${ext}"
            hash="$(awk -v n="$name" '$2 == n {print $1}' dist/checksums.txt)"
            if ! printf '%s' "$hash" | grep -Eq '^[0-9a-f]{64}$'; then
              echo "No unique SHA-256 for $name in checksums.txt" >&2
              exit 1
            fi
            lines="${lines}${TAG} ${os} ${arch} ${hash}"$'\n'
          done
          current="$(gh api -X GET "repos/${REPO}/contents/action/pins.txt" -f ref=main)"
          file_sha="$(printf '%s' "$current" | jq -r '.sha')"
          printf '%s' "$current" | jq -r '.content' | base64 -d > pins.txt
          if grep -q "^${TAG//./\\.} " pins.txt; then
            echo "pins.txt already has lines for $TAG; nothing to do."
            exit 0
          fi
          [ -z "$(tail -c1 pins.txt)" ] || echo >> pins.txt
          printf '%s' "$lines" >> pins.txt
          branch="chore/pin-checksums-${TAG}"
          main_sha="$(gh api "repos/${REPO}/git/ref/heads/main" --jq '.object.sha')"
          gh api --method POST "repos/${REPO}/git/refs" \
            -f "ref=refs/heads/${branch}" -f "sha=${main_sha}" >/dev/null
          gh api --method PUT "repos/${REPO}/contents/action/pins.txt" \
            -f "message=chore: pin checksums for ${TAG}" \
            -f "content=$(base64 -w0 pins.txt)" \
            -f "sha=${file_sha}" \
            -f "branch=${branch}" >/dev/null
          gh api --method POST "repos/${REPO}/pulls" \
            -f "title=chore: pin checksums for ${TAG}" \
            -f "head=${branch}" -f "base=main" \
            -f "body=Appends the SHA-256 of the six ${TAG} archives to action/pins.txt so that pinning the Action by commit SHA pins the binary. Compare the lines with the signed checksums.txt of the release before merging." >/dev/null
          # A pull request opened with GITHUB_TOKEN does not trigger ci.yml, so its required
          # check `ci-ok` would never report. workflow_dispatch is exempt from that rule:
          # run ci.yml on the branch (the checks attach to the branch head commit).
          if [ "$HAS_PINS_PR_TOKEN" != "true" ]; then
            GH_TOKEN="$ACTIONS_TOKEN" gh api --method POST "repos/${REPO}/actions/workflows/ci.yml/dispatches" \
              -f "ref=${branch}" >/dev/null
          fi
