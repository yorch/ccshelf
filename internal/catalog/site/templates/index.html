<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="referrer" content="no-referrer">
<title>{{TITLE}}</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<a class="skip" href="#results">Skip to the results</a>
<header class="top">
  <h1>{{TITLE}}</h1>
  <p class="meta" id="meta"></p>
</header>
<main>
  <noscript><p class="notice">This catalog needs JavaScript. The same data is in <a href="catalog.json">catalog.json</a>.</p></noscript>
  <form class="controls" id="controls" role="search" aria-label="Search and filter plugins">
    <div class="field wide">
      <label for="q">Search</label>
      <input id="q" type="search" autocomplete="off" spellcheck="false" placeholder="Name, description, tag or when to use">
    </div>
    <div class="field">
      <label for="f-category">Category</label>
      <select id="f-category"><option value="">All</option></select>
    </div>
    <div class="field">
      <label for="f-tag">Tag</label>
      <select id="f-tag"><option value="">All</option></select>
    </div>
    <div class="field">
      <label for="f-status">Status</label>
      <select id="f-status"><option value="">All</option></select>
    </div>
    <div class="field">
      <label for="f-owner">Owner</label>
      <select id="f-owner"><option value="">All</option></select>
    </div>
    <div class="field actions">
      <button type="button" id="reset">Clear filters</button>
    </div>
  </form>
  <nav class="tabs" id="tabs" aria-label="Views"></nav>
  <p class="count" id="count" role="status" aria-live="polite"></p>
  <div id="results" tabindex="-1"></div>
</main>
<footer class="foot"><p>Generated by ccshelf. Press / to search.</p></footer>
<script type="application/json" id="catalog-data">{{CATALOG_JSON}}</script>
<script src="app.js"></script>
</body>
</html>
