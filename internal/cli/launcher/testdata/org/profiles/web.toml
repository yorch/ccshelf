name = "web"
description = "Web work"
owner = "@fixture/web"
status = "active"
extends = ["base"]

[plugins]
mode = "allow-only"
include = ["design-kit@acme"]

[mcp]
servers = ["figma"]

[session]
model = "opus"
effort = "high"
