# Org configuration for ccshelf. "ccshelf catalog init --profiles-only" generated this file. Edit it freely.
# Every key is optional. See the ccshelf documentation (catalog and org repo).

[lint]
# CODEOWNERS owners that must own everything that shapes what runs on developer machines
# (profiles, the MCP registry, prompts, workflows, this file).
platform_owners = ["@acme/platform"]

[catalog]
# This repo holds profiles only: no plugin marketplace, no sidecars, no bundles and no catalog.
# ccshelf lint checks the profiles, the MCP registry and ownership. The compile and catalog build commands refuse to run.
enabled = false

[profiles]
dir = "profiles"
mcp_registry = "mcp/registry.toml"

# Controls that no profile may mask. Fill these in once you know them.
[protect]
# plugins = ["audit-logger@your-marketplace"]
# mcp = ["plugin:audit:audit"]
