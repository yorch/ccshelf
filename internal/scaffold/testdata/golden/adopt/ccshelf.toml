# Org configuration for ccshelf. "ccshelf catalog init" generated this file. Edit it freely.
# Every key is optional. See the ccshelf documentation (catalog and org repo).

[lint]
# Sidecar fields every plugin needs. A missing one is a lint error. Add "review_by" to
# make every active plugin carry a review date.
require = ["owner", "status"]
# CODEOWNERS owners that must own everything that runs code or shapes the catalog (hooks,
# MCP, LSP, plugin manifests that declare them, workflows, profiles, bundles, this file).
platform_owners = ["@legacy/platform"]
require_when_deprecated = ["superseded_by"]
max_review_age_days = 180
# Create this file to restrict plugin categories and tags to a list. Without it, the rule is off.
# taxonomy = "catalog/taxonomy.toml"

[catalog]
title = "legacy plugin catalog"
metadata_source = "sidecar"
marketplaces = [".claude-plugin/marketplace.json"]

[profiles]
dir = "profiles"
mcp_registry = "mcp/registry.toml"

# Controls that no profile may mask. Fill these in once you know them.
[protect]
# plugins = ["audit-logger@legacy"]
# mcp = ["plugin:audit:audit"]
