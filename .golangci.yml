# golangci-lint v2 configuration. Keep strict; every exclusion has a reason.
version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: none
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - ineffassign
    - gosec # enforces 0600/0700 permissions (G301, G302, G306) for SR4; see settings.excludes
    - errorlint
    - bodyclose
    - noctx
    - misspell
    - unconvert
    - unparam
    - gocritic
    - revive
    - forbidigo
    - depguard

  settings:
    staticcheck:
      checks:
        - all
        - -ST1000 # package comments: revive checks these
        - -ST1003 # naming: revive checks these
        - -ST1016
        - -ST1020 # doc comment forms: revive checks exported identifiers
        - -ST1021
        - -ST1022
        - -QF1001 # De Morgan quick fix: style only

    gosec:
      excludes:
        - G104 # unhandled errors: errcheck already reports these, with better control
        # G304 (file inclusion via variable) and G703 (path traversal taint) are NOT excluded
        # globally: they are excluded per path under exclusions.rules below, only for the
        # packages whose job is reading user-chosen files with confinement (SR4).

    misspell:
      locale: US

    gocritic:
      # Conservative: the default checks (diagnostic and style tagged as stable), nothing experimental.
      enabled-tags:
        - diagnostic

    revive:
      rules:
        - name: exported
          arguments:
            - checkPrivateReceivers
            - sayRepetitiveInsteadOfStutters
        - name: package-comments
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: receiver-naming
        - name: context-as-argument
        - name: indent-error-flow
        - name: var-naming
        - name: unreachable-code
        - name: increment-decrement

    forbidigo:
      forbid:
        - pattern: ^fmt\.Print(f|ln)?$
          msg: write to an io.Writer (cmd.OutOrStdout, or internal/ui) instead of printing to the process stdout
        - pattern: ^log\.Fatal(f|ln)?$
          msg: return an error; only main may decide to exit
        - pattern: ^log\.Panic(f|ln)?$
          msg: return an error instead of panicking
        # Starting a process is allowed only in internal/claude (the launcher) and cmd/ (excluded
        # below). Everything else goes through those packages, or exec.Command in the git helpers.
        - pattern: ^os\.StartProcess$
          msg: only internal/claude and cmd/ may start a process
        - pattern: ^syscall\.(Exec|ForkExec|StartProcess)$
          msg: only internal/claude and cmd/ may exec or fork
        - pattern: ^unix\.(Exec|ForkExec)$
          msg: only internal/claude and cmd/ may exec or fork

    depguard:
      rules:
        # Third-party dependencies are limited to a short allowlist (SR5, R2).
        deps:
          list-mode: strict
          files:
            - $all
            - "!$test"
          allow:
            - $gostd
            - github.com/ccshelf/ccshelf
            - github.com/spf13/cobra
            - github.com/spf13/pflag # cobra's flag types, used through cobra
            - github.com/pelletier/go-toml/v2
            - golang.org/x/term
            - golang.org/x/sys
        # Packages that must never start a process. The only allowed process runners are
        # internal/claude (the launcher), the git helpers (internal/profile/gitsource and
        # internal/catalog/gitdata) and policy's plutil runner (read.go, named below).
        no-exec:
          files:
            - "**/internal/profile/**"
            - "!**/internal/profile/gitsource/**"
            - "**/internal/settings/**"
            - "**/internal/config/**"
            - "**/internal/envpolicy/**"
            - "**/internal/cache/**"
            - "**/internal/catalog/site/**"
            - "**/internal/catalog/lint/**"
            - "**/internal/catalog/codeowners/**"
            - "**/internal/catalog/sidecar/**"
            - "**/internal/catalog/safepath/**"
            - "**/internal/orgconfig/**"
            - "**/internal/marketplace/**"
            - "**/internal/policy/**"
            - "!**/internal/policy/read.go" # runs plutil on macOS: the one named exception
            - "**/internal/trust/**"
            - "**/internal/bundles/**"
            - "**/internal/doctor/**"
            - "**/internal/recommend/**"
            - "**/internal/analytics/**"
            - "**/internal/ui/**"
            - "**/internal/shellinit/**"
            - "!$test"
          deny:
            - pkg: os/exec
              desc: this package must not run processes; only the launcher and git helpers may
            - pkg: golang.org/x/sys/execabs
              desc: this package must not run processes

  exclusions:
    generated: lax
    presets:
      - std-error-handling
    rules:
      # fmt.Print* and log.* are allowed in main packages and the UI package, but not the
      # process-start rules.
      - path: ^(cmd|internal/ui)/
        text: 'fmt\.Print|log\.'
        linters: [forbidigo]
      # Starting processes is the point of the launcher and of main.
      - path: ^(cmd|internal/claude)/
        text: 'os\.StartProcess|syscall\.|unix\.'
        linters: [forbidigo]
      # Reading user-chosen files is the job of these packages; confinement to the source
      # root is enforced and tested in internal/catalog/safepath and internal/profile (SR4).
      # Scoped per path so that a new package does not inherit the exemption.
      - path: ^internal/(bundles|cache|catalog/catalogtest|catalog/safepath|catalog/site|claude|config|policy|profile|recommend|testutil|trust)/
        text: "G304|G703"
        linters: [gosec]
      # Process execution is the point of these packages (arguments are an argv, never a shell string).
      - path: ^internal/(claude|catalog/gitdata|profile/gitsource)/
        text: "G204"
        linters: [gosec]
      # Tests: relax what does not apply to throwaway fixtures.
      - path: _test\.go
        linters:
          - gosec # temp files and fixtures
          - forbidigo
          - unparam
          - errcheck
          - noctx
          - revive
          - gocritic

formatters:
  enable:
    - gofumpt

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
