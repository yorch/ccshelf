name: catalog

# Builds the catalog on merge to main and publishes it to GitHub Pages.
# Any static host works instead: replace the two Pages steps and the visibility check with
# your own upload of dist/catalog. GHE Server admins must mirror or allow the actions used here.
on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: catalog
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the catalog
        uses: ccshelf/ccshelf/action@0000000000000000000000000000000000000000 # TODO replace with the released commit SHA of ccshelf
        with:
          version: v0.1.0
          sha256: ${{ vars.CCSHELF_SHA256_LINUX_AMD64 }}
          args: catalog build --out dist/catalog

      - name: Package the site for Pages
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/catalog

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    # Protect this environment: deployable from main only, so secrets and publishing
    # never reach pull requests. The plugin list can be sensitive, so Pages visibility
    # must be private or internal (the check below enforces it).
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Refuse to publish to a public site
        env:
          GH_TOKEN: ${{ github.token }}
          API_URL: ${{ github.api_url }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Pages must already exist (Settings > Pages > Source: GitHub Actions).
          body="$(curl --fail --silent --show-error \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            "${API_URL}/repos/${REPO}/pages")"
          public="$(printf '%s' "$body" | jq -r '.public')"
          if [ "$public" != "false" ]; then
            echo "error: GitHub Pages for ${REPO} is public (or its visibility is unknown). Set Pages visibility to private or internal, or publish to an internal static host." >&2
            exit 1
          fi

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
