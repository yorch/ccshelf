# Named MCP server definitions that profiles reference by name.
# Security-sensitive: a command here runs on developer machines. Owned by the platform team.

# Read design files and tokens from Figma (fictional package).
[servers.figma]
type = "stdio"
command = "npx"
args = ["-y", "@acme-example/figma-mcp@1.0.0"]

[servers.figma.windows]
command = "cmd"
args = ["/c", "npx", "-y", "@acme-example/figma-mcp@1.0.0"]

# Read-only access to the on-call schedule and incidents.
[servers.pagerduty-ro]
type = "http"
url = "https://pagerduty-mcp.acme.example/v1"
