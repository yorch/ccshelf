name = "frontend"
description = "React, CSS and accessibility work on the Acme web apps"
owner = "@acme/web"
status = "active"
superseded_by = ""
account = ""
extends = ["base"]
when_to_use = ["UI components", "visual QA", "accessibility fixes", "design system work"]
avoid_when = ["infrastructure changes", "incident response"]

[plugins]
mode = "allow-only"
include = ["design-kit@acme", "docs-writer@acme"]
exclude = []

[mcp]
servers = ["figma"]
claudeai_connectors = "none"
strict = true

[session]
model = "opus"
effort = "high"
output_style = "Explanatory"
append_system_prompt_file = "prompts/frontend.md"
inherit_user_settings = true

[session.env]
FIGMA_TOKEN_REF = "op://dev/figma/token"

[policy]
on_blocked = "warn"
