# Shared defaults that other profiles extend. It selects no plugins.
name = "base"
description = "Shared defaults: no claude.ai connectors, only the MCP servers a profile names"
owner = "@acme/platform"
status = "active"
superseded_by = ""
account = ""
extends = []
when_to_use = ["a parent for other profiles"]
avoid_when = ["running directly; it has no plugins"]

[plugins]
mode = "allow-only"
include = []
exclude = []

[mcp]
servers = []
claudeai_connectors = "none"
# strict is inherited by every child that does not set it. Where
# --strict-mcp-config can be used, only the profile's servers load (none here),
# so the user's own MCP servers are dropped; under a policy block or a protected
# MCP server ccshelf falls back to deniedMcpServers. Set strict = false in a
# child, or remove it here, to keep them.
strict = true

[session]
effort = "medium"
inherit_user_settings = true

[policy]
on_blocked = "warn"
